# ============================================================
# Nigeria Macro Tracker — Automated Data Pipeline
# update_data.yml
# ============================================================
# SCHEDULE: Every Monday at 6:00 AM UTC
# PURPOSE:  Fetch fresh data from all sources and save to repo
# ============================================================

name: Weekly Data Update

# --- TRIGGER ---
# This workflow runs on two conditions:
# 1. On a schedule (every Monday 6am UTC)
# 2. Manually via the GitHub Actions UI (workflow_dispatch)
#    This lets us trigger a run at any time for testing
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# --- JOBS ---
jobs:
  update-data:
    
    # Use the latest Ubuntu Linux machine
    runs-on: ubuntu-latest
    
    # Grant permission to write files back to the repo
    permissions:
      contents: write
    
    steps:
      
      # --- STEP 1: Check out the repository ---
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # --- STEP 2: Set up Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      # --- STEP 3: Install dependencies ---
      # Installs all libraries from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # --- STEP 4: Run the data pipeline ---
      # Fetches all 7 indicators and saves CSV
      - name: Fetch macro indicators
        run: python scripts/fetch_data.py
      
      # --- STEP 5: Run the stress index calculator ---
      # Calculates composite score from fresh data
      - name: Calculate stress index
        run: python scripts/stress_index.py
      
      # --- STEP 6: Commit and push updated data ---
      # Saves the new CSV files back to GitHub
      # Uses a bot identity for the commit
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/macro_indicators.csv
          git add data/processed/stress_index.csv
          git add data/raw/
          git diff --staged --quiet || git commit -m "Auto update: $(date +'%Y-%m-%d')"
          git push


